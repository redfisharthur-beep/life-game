<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>人生｜多人派對遊戲</title>
  <link rel="stylesheet" href="/style.css?v=20260827-1410" />
  <link rel="stylesheet" href="/player-status.css?v=20260827-1425" />
  <link rel="stylesheet" href="/action-buttons.css?v=20260827-1455" />
  <link rel="stylesheet" href="/market-icons.css?v=20260827-1515" />
</head>
<body>
  <main class="shell">
    <section class="card" id="lobbyCard">
      <img class="game-logo" src="/images/Logo.png?v=20260827-1345" alt="人生" />

      <div id="entryPanel" class="panel">
        <label class="field entry-control">
          <input id="playerName" maxlength="12" autocomplete="nickname" placeholder="暱稱" />
        </label>

        <button id="joinGameBtn" class="primary entry-control" type="button">迎向新局</button>
        <p id="message" class="message" aria-live="polite"></p>
      </div>

      <div id="roomPanel" class="panel hidden">
        <div class="players-head compact">
          <span id="playerCount">0 / 6</span>
        </div>
        <div id="playerList" class="players"></div>

        <button id="startGameBtn" class="start-button" type="button" disabled>啟程</button>
        <p id="launchMessage" class="launch-message" aria-live="polite"></p>
        <button id="leaveRoomBtn" class="ghost" type="button">離開房間</button>
      </div>

      <div id="professionPanel" class="panel hidden">
        <h2 class="profession-title">選擇職業</h2>
        <p class="profession-subtitle">每個職業同一局只能有一位玩家</p>
        <div id="professionGrid" class="profession-grid"></div>
        <p id="professionMessage" class="profession-message" aria-live="polite"></p>
      </div>

      <div id="gamePanel" class="panel hidden">
        <section id="playerStatusBar" class="player-status-bar" aria-label="玩家資訊"></section>

        <div class="game-topbar">
          <div>
            <span id="stageName" class="stage-name">人生起步</span>
            <span id="roundLabel" class="round-label">第 1 / 30 回合</span>
          </div>
          <div class="market-strip" aria-label="最新市場價格">
            <span class="market-item">
              <img class="market-icon" src="/images/stock.png" alt="股價" />
              <span class="market-label">股價</span>
              <b id="stockPrice" class="market-value">10.00</b>
            </span>
            <span class="market-item">
              <img class="market-icon" src="/images/land.png" alt="地價" />
              <span class="market-label">地價</span>
              <b id="landPrice" class="market-value">10.00</b>
            </span>
          </div>
        </div>

        <section class="me-card">
          <div class="me-head">
            <div>
              <span id="myName" class="me-name">玩家</span>
              <span id="myProfession" class="me-profession">職業</span>
            </div>
            <div class="timer-box">
              <span class="timer-label">剩餘</span>
              <strong id="turnTimer">10</strong>
              <span>秒</span>
            </div>
          </div>
          <div class="asset-grid">
            <span>現金 <b id="myCash">0</b></span>
            <span>股票 <b id="myStocks">0</b></span>
            <span>土地 <b id="myLand">0</b></span>
            <span>幸福 <b id="myHappiness">0.00</b></span>
          </div>
        </section>

        <section class="turn-section">
          <div class="turn-title">本輪順序</div>
          <div id="turnOrder" class="turn-order"></div>
          <p id="turnNotice" class="turn-notice">等待回合開始…</p>
        </section>

        <section class="actions-section">
          <div id="actionGrid" class="action-grid">
            <button class="action-button" data-action="salary" type="button" aria-label="領薪">
              <img class="action-image" src="/images/salary.png" alt="領薪" />
            </button>
            <button class="action-button" data-action="buyStock" type="button" aria-label="買股" disabled>
              <img class="action-image" src="/images/buystock.png" alt="買股" />
            </button>
            <button class="action-button" data-action="buyLand" type="button" aria-label="圈地" disabled>
              <img class="action-image" src="/images/buyland.png" alt="圈地" />
            </button>
            <button class="action-button" data-action="fate" type="button" aria-label="命運" disabled>
              <img class="action-image" src="/images/destiny.png" alt="命運" />
            </button>
            <button class="action-button" data-action="sabotage" type="button" aria-label="陷害" disabled>
              <img class="action-image" src="/images/frame.png" alt="陷害" />
            </button>
            <button class="action-button" data-action="help" type="button" aria-label="援助" disabled>
              <img class="action-image" src="/images/assistance.png" alt="援助" />
            </button>
            <button class="action-button" data-action="sellStock" type="button" aria-label="賣股" disabled>
              <img class="action-image" src="/images/Sellstock.png" alt="賣股" />
            </button>
            <button class="action-button" data-action="sellLand" type="button" aria-label="賣地" disabled>
              <img class="action-image" src="/images/Sellland.png" alt="賣地" />
            </button>
            <button class="action-button" data-action="dream" type="button" aria-label="圓夢" disabled>
              <img class="action-image" src="/images/dream.png" alt="圓夢" />
            </button>
          </div>
        </section>

        <section class="event-box">
          <span class="event-label">最新事件</span>
          <p id="gameEvent">職業選擇完成，人生啟程！</p>
        </section>
      </div>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js?v=20260827-1515"></script>
  <script src="/player-status.js?v=20260827-1425"></script>
</body>
</html>
