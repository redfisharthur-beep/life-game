name: Apply action showcase pause

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-action-showcase-pause.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch server showcase timing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('server.js')
          text = path.read_text(encoding='utf-8')

          old_constants = "const TURN_MS = 10_000;\nconst TOTAL_ROUNDS = 30;"
          new_constants = "const TURN_MS = 10_000;\nconst ACTION_SHOWCASE_MS = 6_000;\nconst TOTAL_ROUNDS = 30;"
          if old_constants not in text:
              raise SystemExit('Expected timer constants were not found')
          text = text.replace(old_constants, new_constants, 1)

          old_advance = """function advanceTurn(room) {
            if (!room.game || room.phase !== 'game') return;
            clearTurnTimer(room);
            room.game.turnIndex += 1;
            beginTurn(room);
          }
          """

          new_advance = """function advanceTurn(room) {
            if (!room.game || room.phase !== 'game') return;

            clearTurnTimer(room);
            room.game.deadline = null;
            emitRoom(room);

            const expectedTurnId = room.game.turnId;
            room.turnTimer = setTimeout(() => {
              const currentRoom = rooms.get(room.code);
              if (!currentRoom || currentRoom.phase !== 'game' || !currentRoom.game) return;
              if (currentRoom.game.turnId !== expectedTurnId) return;

              currentRoom.game.turnIndex += 1;
              beginTurn(currentRoom);
            }, ACTION_SHOWCASE_MS);
          }
          """

          if old_advance not in text:
              raise SystemExit('Expected advanceTurn function was not found')
          text = text.replace(old_advance, new_advance, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/apply-action-showcase-pause.yml

      - name: Commit patched server
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js .github/workflows/apply-action-showcase-pause.yml
          git commit -m "Pause turns for synchronized action showcase"
          git push
