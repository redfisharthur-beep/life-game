<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>人生｜多人派對遊戲</title>
  <link rel="stylesheet" href="/style.css?v=20260827-1410" />
  <link rel="stylesheet" href="/player-status.css?v=20260828-0019" />
  <link rel="stylesheet" href="/action-buttons.css?v=20260827-1820" />
  <link rel="stylesheet" href="/market-icons.css?v=20260827-2312" />
  <link rel="stylesheet" href="/profession-layout.css?v=20260827-2326" />
  <link rel="stylesheet" href="/action-showcase.css?v=20260827-2135" />
  <link rel="stylesheet" href="/showcase-result-overrides.css?v=20260827-2045" />
  <link rel="stylesheet" href="/game-typography.css?v=20260827-2312" />
  <link rel="stylesheet" href="/game-complete.css?v=20260827-1620" />
  <link rel="stylesheet" href="/logo-display.css?v=20260827-1610" />
  <link rel="stylesheet" href="/front-page.css?v=20260827-2055" />
  <link rel="stylesheet" href="/player-list.css?v=20260827-2341" />
  <link rel="stylesheet" href="/major-event.css?v=20260827-2345" />
  <link rel="stylesheet" href="/announcement-tone.css?v=20260827-2225" />
  <link rel="stylesheet" href="/ui-final-tweaks.css?v=20260827-2318" />
</head>
<body>
  <main class="shell">
    <section class="card" id="lobbyCard">
      <img id="gameLogo" class="game-logo" src="/images/logo.png?v=20260827-1610" alt="人生" />

      <div id="homeStage" class="home-stage">
        <img class="front-page-image" src="/images/front%20page.png?v=20260827-1710" alt="人生首頁" />

        <div id="entryPanel" class="panel home-entry-panel">
          <label class="field entry-control">
            <input id="playerName" maxlength="12" autocomplete="nickname" placeholder="輸入名字" />
          </label>

          <button id="joinGameBtn" class="primary entry-control" type="button">迎向新局</button>
          <p id="message" class="message" aria-live="polite"></p>
        </div>
      </div>

      <div id="roomPanel" class="panel hidden">
        <div class="player-list-stage">
          <img class="player-list-bg" src="/images/Player%20List.png?v=20260827-1905" alt="玩家等待畫面" />
          <div class="player-list-overlay">
            <div class="players-head compact">
              <span id="playerCount">0 / 6</span>
            </div>
            <div id="playerList" class="players"></div>

            <button id="startGameBtn" class="start-button" type="button" disabled>啟程</button>
            <p id="launchMessage" class="launch-message" aria-live="polite"></p>
            <button id="leaveRoomBtn" class="ghost" type="button">離開房間</button>
          </div>
        </div>
      </div>

      <div id="professionPanel" class="panel hidden">
        <div class="profession-stage">
          <img class="profession-stage-image" src="/images/select.png?v=20260827-1735" alt="選擇職業" />
          <div id="professionGrid" class="profession-grid"></div>
        </div>
        <p id="professionMessage" class="profession-message" aria-live="polite"></p>
      </div>

      <div id="gamePanel" class="panel hidden">
        <section id="playerStatusBar" class="player-status-bar" aria-label="玩家資訊"></section>

        <div class="game-topbar">
          <div class="stage-block">
            <span id="stageName" class="stage-name">人生起步</span>
            <span id="roundLabel" class="round-label">21歲</span>
          </div>

          <div class="game-topbar-right">
            <div class="timer-box topbar-timer" aria-label="回合剩餘秒數">
              <strong id="turnTimer">10</strong>
            </div>

            <div class="market-strip" aria-label="最新市場價格">
              <span class="market-item" title="股市">
                <img class="market-icon" src="/images/stock.png" alt="股市" />
                <b id="stockPrice" class="market-value">10.00</b>
              </span>
              <span class="market-item" title="地價">
                <img class="market-icon" src="/images/land.png" alt="地價" />
                <b id="landPrice" class="market-value">10.00</b>
              </span>
            </div>
          </div>
        </div>

        <section class="me-card">
          <div class="me-head">
            <div>
              <span id="myName" class="me-name">玩家</span>
              <span id="myProfession" class="me-profession">職業</span>
            </div>
          </div>
          <div class="asset-grid">
            <span>現金 <b id="myCash">0</b></span>
            <span>股票 <b id="myStocks">0</b></span>
            <span>土地 <b id="myLand">0</b></span>
            <span>幸福 <b id="myHappiness">0.00</b></span>
          </div>
        </section>

        <section class="turn-section hidden" aria-hidden="true">
          <div class="turn-title">本輪順序</div>
          <div id="turnOrder" class="turn-order"></div>
          <p id="turnNotice" class="turn-notice">等待回合開始…</p>
        </section>

        <section class="actions-section">
          <div id="actionGrid" class="action-grid">
            <button class="action-button" data-action="salary" type="button" aria-label="領薪">
              <img class="action-image" src="/images/salary.png" alt="領薪" />
            </button>
            <button class="action-button" data-action="buyStock" type="button" aria-label="買股" disabled>
              <img class="action-image" src="/images/buystock.png" alt="買股" />
            </button>
            <button class="action-button" data-action="buyLand" type="button" aria-label="圈地" disabled>
              <img class="action-image" src="/images/buyland.png" alt="圈地" />
            </button>
            <button class="action-button" data-action="fate" type="button" aria-label="命運" disabled>
              <img class="action-image" src="/images/destiny.png" alt="命運" />
            </button>
            <button class="action-button" data-action="sabotage" type="button" aria-label="陷害" disabled>
              <img class="action-image" src="/images/frame.png" alt="陷害" />
            </button>
            <button class="action-button" data-action="help" type="button" aria-label="援助" disabled>
              <img class="action-image" src="/images/assistance.png" alt="援助" />
            </button>
            <button class="action-button" data-action="sellStock" type="button" aria-label="賣股" disabled>
              <img class="action-image" src="/images/Sellstock.png" alt="賣股" />
            </button>
            <button class="action-button" data-action="sellLand" type="button" aria-label="賣地" disabled>
              <img class="action-image" src="/images/Sellland.png" alt="賣地" />
            </button>
            <button class="action-button" data-action="dream" type="button" aria-label="圓夢" disabled>
              <img class="action-image" src="/images/dream.png" alt="圓夢" />
            </button>
          </div>
        </section>

        <section class="event-box">
          <span class="event-label">最新事件</span>
          <p id="gameEvent">職業選擇完成，人生啟程！</p>
        </section>

        <section id="gameResults" class="game-results hidden" aria-live="polite">
          <div class="results-heading">
            <span>人生結算</span>
            <strong id="resultWinner">🏆</strong>
          </div>
          <div id="rankingList" class="ranking-list"></div>
          <div class="results-actions">
            <button id="restartGameBtn" class="start-button" type="button">再來一局</button>
            <button id="leaveGameBtn" class="ghost" type="button">返回首頁</button>
          </div>
        </section>
      </div>
    </section>
  </main>

  <section id="roundAnnouncement" class="round-announcement hidden" aria-live="assertive">
    <strong>人生加速！</strong>
    <span>從現在開始每回合擲2顆骰子！</span>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js?v=20260827-2145"></script>
  <script src="/age-display.js?v=20260827-2310"></script>
  <script src="/player-status.js?v=20260828-0019"></script>
  <script src="/action-showcase.js?v=20260827-2010"></script>
  <script src="/showcase-result-overrides.js?v=20260827-2058"></script>
  <script src="/major-event.js?v=20260827-2345"></script>
  <script src="/announcement-tone.js?v=20260827-2225"></script>
  <script src="/logo-visibility.js?v=20260827-1905"></script>
  <script src="/ui-final-tweaks.js?v=20260827-2334"></script>
</body>
</html>
