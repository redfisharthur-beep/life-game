<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>人生｜多人派對遊戲</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="shell">
    <section class="card" id="lobbyCard">
      <p class="eyebrow">LIFE GAME</p>
      <h1>《人生》</h1>

      <div id="entryPanel" class="panel">
        <label class="field entry-control">
          <input id="playerName" maxlength="12" autocomplete="nickname" placeholder="暱稱" />
        </label>

        <button id="joinGameBtn" class="primary entry-control" type="button">迎向新局</button>
        <p id="message" class="message" aria-live="polite"></p>
      </div>

      <div id="roomPanel" class="panel hidden">
        <p class="room-label">等待區</p>
        <p class="room-tip">系統已自動配對，最多6人。</p>

        <div class="players-head">
          <strong>玩家名單</strong>
          <span id="playerCount">0 / 6</span>
        </div>
        <div id="playerList" class="players"></div>

        <p id="roomNotice" class="room-notice">等待其他玩家加入…</p>
        <button id="leaveRoomBtn" class="ghost" type="button">離開房間</button>
      </div>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
