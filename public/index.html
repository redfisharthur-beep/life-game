<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>人生｜多人派對遊戲</title>
  <link rel="stylesheet" href="/style.css?v=20260827-1410" />
  <link rel="stylesheet" href="/player-status.css?v=20260830-1450" />
  <link rel="stylesheet" href="/action-buttons.css?v=20260830-1555" />
  <link rel="stylesheet" href="/market-icons.css?v=20260830-1405" />
  <link rel="stylesheet" href="/profession-layout.css?v=20260828-1230" />
  <link rel="stylesheet" href="/profession-position.css?v=20260828-1324" />
  <link rel="stylesheet" href="/profession-eight.css?v=20260830-1350" />
  <link rel="stylesheet" href="/action-showcase.css?v=20260830-2130" />
  <link rel="stylesheet" href="/dice-animation.css?v=20260830-2130" />
  <link rel="stylesheet" href="/game-ui-v2.css?v=20260830-1435" />
  <link rel="stylesheet" href="/game-typography.css?v=20260830-1555" />
  <link rel="stylesheet" href="/dream-result.css?v=20260830-1806" />
  <link rel="stylesheet" href="/game-complete.css?v=20260830-1420" />
  <link rel="stylesheet" href="/logo-display.css?v=20260827-1610" />
  <link rel="stylesheet" href="/front-page.css?v=20260831-1744" />
  <link rel="stylesheet" href="/player-list.css?v=20260830-1341" />
  <link rel="stylesheet" href="/room-browser.css?v=20260830-2032" data-room-browser-style="1" />
  <link rel="stylesheet" href="/major-event.css?v=20260830-1435" />
  <link rel="stylesheet" href="/announcement-tone.css?v=20260827-2225" />
  <link rel="stylesheet" href="/ui-final-tweaks.css?v=20260829-1301" />
  <link rel="stylesheet" href="/rules-viewer.css?v=20260830-1745" />
  <link rel="stylesheet" href="/room-controls.css?v=20260830-1400" />
  <link rel="stylesheet" href="/result-simple.css?v=20260830-2218" />
</head>
<body>
  <main class="shell">
    <section class="card" id="lobbyCard">
      <img id="gameLogo" class="game-logo" src="/images/logo.png?v=20260827-1610" alt="人生" decoding="async" />

      <div id="homeStage" class="home-stage">
        <img class="front-page-image" src="/images/front%20page.png?v=20260827-1710" alt="人生首頁" decoding="async" />
        <div id="entryPanel" class="panel home-entry-panel">
          <label class="field entry-control"><input id="playerName" maxlength="12" autocomplete="nickname" /></label>
          <button id="joinGameBtn" class="primary entry-control" type="button">迎向新局</button>
          <p id="message" class="message" aria-live="polite"></p>
        </div>
      </div>

      <div id="roomBrowserPanel" class="panel room-browser-panel hidden">
        <div class="room-browser-stage">
          <img class="room-browser-bg" src="/images/Player%20List.png?v=20260827-1905" alt="房間列表" decoding="async" />
          <div class="room-browser-overlay">
            <div id="roomBrowserList" class="room-browser-list" aria-live="polite"></div>
            <div class="room-browser-actions">
              <button id="roomBrowserBackBtn" class="room-browser-action" type="button" aria-label="上一頁" title="上一頁"></button>
              <button id="roomBrowserRulesBtn" class="room-browser-action" type="button" aria-label="遊戲規則" title="遊戲規則"></button>
            </div>
          </div>
        </div>
      </div>

      <div id="roomPanel" class="panel hidden">
        <div class="player-list-stage">
          <img class="player-list-bg" src="/images/Player%20List.png?v=20260827-1905" alt="玩家等待畫面" decoding="async" />
          <div class="player-list-overlay">
            <div class="players-head compact"><span id="playerCount">0 / 6</span></div>
            <div id="playerList" class="players"></div>
            <button id="startGameBtn" class="start-button" type="button" disabled>啟程</button>
            <p id="launchMessage" class="launch-message" aria-live="polite"></p>
            <button id="leaveRoomBtn" class="home-pill" type="button" aria-label="返回房間列表" title="返回房間列表">房間列表</button>
            <button id="roomRulesOpenBtn" type="button" aria-label="遊戲說明" title="遊戲說明"></button>
          </div>
        </div>
      </div>

      <div id="professionPanel" class="panel hidden">
        <div class="profession-stage">
          <img class="profession-stage-image" src="/images/Player%20List.png?v=20260827-1905" alt="選擇職業" loading="lazy" decoding="async" />
          <button id="professionHomeBtn" class="home-pill profession-home-pill" type="button" aria-label="回到上一頁">回到首頁</button>
          <button id="rulesOpenBtn" class="rules-pill" type="button" aria-label="遊戲規則">遊戲規則</button>
          <div id="professionGrid" class="profession-grid"></div>
        </div>
        <p id="professionMessage" class="profession-message" aria-live="polite"></p>
      </div>

      <div id="gamePanel" class="panel hidden">
        <section id="playerStatusBar" class="player-status-bar" aria-label="玩家資訊"></section>
        <div class="game-topbar">
          <div class="stage-block"><span id="stageName" class="stage-name">人生起步</span><span id="roundLabel" class="round-label">21歲</span></div>
          <div class="game-topbar-right">
            <div class="timer-box topbar-timer" aria-label="回合剩餘秒數"><strong id="turnTimer">6</strong></div>
            <div class="market-strip" aria-label="最新市場價格">
              <span class="market-item" title="股市"><img class="market-icon" src="/images/stock.png" alt="股市" loading="lazy" decoding="async" /><b id="stockPrice" class="market-value">10.00</b></span>
              <span class="market-item" title="地價"><img class="market-icon" src="/images/land.png" alt="地價" loading="lazy" decoding="async" /><b id="landPrice" class="market-value">10.00</b></span>
            </div>
          </div>
        </div>

        <section class="me-card">
          <div class="me-head"><div><span id="myName" class="me-name">玩家</span><span id="myProfession" class="me-profession">職業</span></div></div>
          <div class="asset-grid"><span>現金 <b id="myCash">0</b></span><span>股票 <b id="myStocks">0</b></span><span>土地 <b id="myLand">0</b></span><span>幸福 <b id="myHappiness">0.00</b></span></div>
        </section>

        <section class="turn-section hidden" aria-hidden="true"><div class="turn-title">本輪順序</div><div id="turnOrder" class="turn-order"></div><p id="turnNotice" class="turn-notice">等待回合開始…</p></section>

        <section class="actions-section">
          <div id="actionGrid" class="action-grid">
            <button class="action-button" data-action="salary" type="button" aria-label="領薪"><img class="action-image" src="/images/salary.png" alt="領薪" loading="lazy" decoding="async" /></button>
            <button class="action-button" data-action="buyStock" type="button" aria-label="買股" disabled><img class="action-image" src="/images/buystock.png" alt="買股" loading="lazy" decoding="async" /></button>
            <button class="action-button" data-action="buyLand" type="button" aria-label="圈地" disabled><img class="action-image" src="/images/buyland.png" alt="圈地" loading="lazy" decoding="async" /></button>
            <button class="action-button" data-action="fate" type="button" aria-label="命運" disabled><img class="action-image" src="/images/destiny.png" alt="命運" loading="lazy" decoding="async" /></button>
            <button class="action-button" data-action="sabotage" type="button" aria-label="陷害" disabled><img class="action-image" src="/images/frame.png" alt="陷害" loading="lazy" decoding="async" /></button>
            <button class="action-button" data-action="help" type="button" aria-label="援助" disabled><img class="action-image" src="/images/assistance.png" alt="援助" loading="lazy" decoding="async" /></button>
            <button class="action-button" data-action="sellStock" type="button" aria-label="賣股" disabled><img class="action-image" src="/images/Sellstock.png" alt="賣股" loading="lazy" decoding="async" /></button>
            <button class="action-button" data-action="sellLand" type="button" aria-label="賣地" disabled><img class="action-image" src="/images/Sellland.png" alt="賣地" loading="lazy" decoding="async" /></button>
            <button class="action-button" data-action="dream" type="button" aria-label="圓夢" disabled><img class="action-image" src="/images/dream.png" alt="圓夢" loading="lazy" decoding="async" /></button>
          </div>
        </section>

        <section class="event-box"><span class="event-label">最新事件</span><p id="gameEvent">職業選擇完成，人生啟程！</p></section>
        <section id="gameResults" class="game-results hidden" aria-live="polite">
          <div class="results-heading"><span>人生結算</span><strong id="resultWinner">🏆</strong></div>
          <div id="rankingList" class="ranking-list"></div>
          <div class="results-actions"><button id="restartGameBtn" class="start-button" type="button">再來一局</button><button id="leaveGameBtn" class="home-pill" type="button">回到首頁</button></div>
        </section>
      </div>
    </section>
  </main>

  <section id="roundAnnouncement" class="round-announcement hidden" aria-live="assertive"><img class="round-announcement-image" src="/images/The%20tide%20of%20the%20times.png" alt="時代浪潮" loading="lazy" decoding="async" /></section>

  <section id="rulesViewer" class="rules-viewer hidden" aria-hidden="true" aria-label="遊戲規則">
    <div class="rules-viewer-card" role="dialog" aria-modal="true" aria-label="遊戲規則圖片">
      <button id="rulesCloseBtn" class="rules-viewer-close" type="button" aria-label="關閉遊戲規則">×</button>
      <div class="rules-viewer-page">
        <img class="rules-viewer-image" src="/images/rules1.png" alt="遊戲規則第1頁" loading="lazy" decoding="async" />
        <img class="rules-viewer-image" src="/images/rules2.png" alt="遊戲規則第2頁" loading="lazy" decoding="async" />
        <img class="rules-viewer-image" src="/images/rules3.png" alt="遊戲規則第3頁" loading="lazy" decoding="async" />
      </div>
    </div>
  </section>

  <script src="/cloudflare-socket.js?v=20260830-1725"></script>
  <script src="/app.js?v=20260830-1245"></script>
  <script src="/lobby-disconnect.js?v=20260830-1818"></script>
  <script src="/room-browser.js?v=20260831-0655" data-room-browser-script="1"></script>
  <script src="/room-controls.js?v=20260830-2115"></script>
  <script src="/homepage-music.js?v=20260830-2115"></script>
  <script src="/result-idle-exit.js?v=20260830-2228"></script>
  <script src="/age-display.js?v=20260830-1435"></script>
  <script src="/player-status.js?v=20260830-2115"></script>
  <script src="/haptics.js?v=20260830-1500"></script>
  <script src="/cheer-feedback.js?v=20260830-2130"></script>
  <script src="/action-showcase.js?v=20260831-0935"></script>
  <script src="/dice-animation.js?v=20260830-2130"></script>
  <script src="/major-event.js?v=20260830-1435"></script>
  <script src="/announcement-tone.js?v=20260827-2225"></script>
  <script src="/logo-visibility.js?v=20260827-1905"></script>
  <script src="/ui-final-tweaks.js?v=20260831-1744"></script>
  <script src="/rules-viewer.js?v=20260830-2115"></script>
  <script src="/winner-profession.js?v=20260829-0004"></script>
</body>
</html>
